name: Tests, builds et documentation GitHub Pages

# L'application (PWA) est publiée par Cloudflare Workers à partir de main (npm run build, base « / »).
# GitHub Pages (https://g7ed6e.github.io/dysapps/) publie le site de documentation (npm run www:build).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aucune permission par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

# Sur une pull request, une exécution nouvelle annule l'ancienne. Sur main, chaque exécution a son propre groupe :
# les tests, les captures et la construction du site ne s'attendent jamais l'une l'autre ; seul le job deploy
# se range dans le groupe « pages » (plus bas).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions épinglées par SHA (mises à jour par Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tout l'historique et les étiquettes : la version se calcule depuis la dernière étiquette vX.Y.Z,
          # et la documentation date chaque page de son dernier commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Pas de cache partagé : évite l'empoisonnement de cache entre exécutions.
          package-manager-cache: false
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les signatures des paquets npm
        run: npm audit signatures
      # La version se calcule depuis git (scripts/version.mjs, façon GitVersion) : aucune pull request ne l'écrit.
      # Sur une pull request, c'est la version qu'aura main après la fusion.
      - name: Calculer la version
        id: version
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
      # La page des personnages du pilotage (hors du site) suit les données du jeu.
      - name: Vérifier la page des personnages du pilotage
        run: npm run pilotage:personnages -- --check
      # Les données des îles et des missions du portail écrites en Markdown (docs/contenu/) suivent leur Markdown.
      - name: Vérifier les exercices écrits en Markdown
        run: npm run contenu -- --check
      # Les règles des hooks de React (oxlint) et le code mort : fichiers, exports et dépendances que rien n'utilise (knip).
      - run: npm run lint
      - run: npm run code-mort
      - run: npm test
      # L'application, telle que Cloudflare la construit (base « / ») : vérification seulement, rien n'est publié d'ici.
      - run: npm run build

  # Les captures d'écran du manuel ne sont pas dans le dépôt : ce job rejoue le jeu dans Chromium
  # (scripts/www/captures.mjs), en parallèle des tests, et passe les images au job docs.
  # Sur main seulement : une pull request n'attend pas les captures (npm run www:captures en local pour les relire).
  captures:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Le Chromium de la version de playwright-core du dépôt, avec ses bibliothèques système.
      - name: Installer Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Faire les captures d'écran
        run: npm run www:captures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captures
          path: www/_captures/*.jpg
          if-no-files-found: error
          retention-days: 7

  # Le site de documentation, publié sur GitHub Pages dans /<nom du dépôt>/, avec les captures du job précédent.
  # Sur une pull request, le job captures est sauté : le site se construit avec des images vides à la place.
  docs:
    needs: captures
    if: ${{ !cancelled() && needs.captures.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      a_jour: ${{ steps.tete.outputs.a_jour }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # La documentation date chaque page de son dernier commit et affiche la version calculée depuis git.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.captures.result == 'success'
        with:
          name: captures
          path: www/_captures
      # DOCS_CAPTURES=required (sur main) : une capture citée par une page et absente fait échouer le build.
      - run: npm run www:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          DOCS_CAPTURES: ${{ needs.captures.result == 'success' && 'required' || '' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist-www
      # Une exécution dépassée par un commit plus récent de main ne publie pas : sans cela, une exécution plus
      # lente (les captures) publierait l'ancien site par-dessus le nouveau. Décidé ici, et non dans deploy :
      # le job deploy entre dans le groupe « pages » avant son premier pas, et y annulerait la publication récente.
      - name: Vérifier que ce commit est toujours la tête de main
        id: tete
        if: github.ref == 'refs/heads/main'
        run: |
          tete=$(git ls-remote --exit-code origin refs/heads/main) || { echo "::error::Tête de main introuvable"; exit 1; }
          tete=${tete%%$'\t'*}
          if [ "$tete" = "$GITHUB_SHA" ]; then echo "a_jour=true" >> "$GITHUB_OUTPUT"; else echo "Dépassé par $tete : pas de publication."; echo "a_jour=false" >> "$GITHUB_OUTPUT"; fi

  # Pose l'étiquette vX.Y.Z sur le commit publié : repère lisible dans l'historique, et point d'ancrage court
  # pour le calcul des versions suivantes. N'exécute aucun code du dépôt (appel à l'API seulement).
  tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Étiqueter la version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version inattendue : $VERSION"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "v$VERSION existe déjà."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
            echo "Étiquette v$VERSION posée sur $GITHUB_SHA."
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && needs.docs.outputs.a_jour == 'true'
    needs: [build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une publication plus récente remplace celle qui attend ou qui tourne encore : une publication restée
    # bloquée chez GitHub (du 30 septembre au 4 octobre 2026, le site n'a plus été publié) ne retient plus les suivantes.
    # Le modèle de GitHub Pages met cancel-in-progress à false ; ici, true, pour cette raison. Une publication Pages
    # annulée laisse le site précédent en ligne, et seule une plus ancienne peut l'être (voir le job docs).
    concurrency:
      group: pages
      cancel-in-progress: true
    # Seul ce job peut publier : il n'exécute aucun code du dépôt.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
