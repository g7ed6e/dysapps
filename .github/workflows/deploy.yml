name: Tests, builds et documentation GitHub Pages

# L'application (PWA) est publiée par Cloudflare Workers à partir de main (npm run build, base « / »).
# GitHub Pages (https://g7ed6e.github.io/dysapps/) publie le site de documentation (npm run docs:build).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aucune permission par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  # On annule les anciennes exécutions de PR, jamais un déploiement en cours sur main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions épinglées par SHA (mises à jour par Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tout l'historique et les étiquettes : la version se calcule depuis la dernière étiquette vX.Y.Z,
          # le journal compare avec la branche de base, et la documentation date chaque page de son dernier commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Pas de cache partagé : évite l'empoisonnement de cache entre exécutions.
          package-manager-cache: false
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les signatures des paquets npm
        run: npm audit signatures
      # La version se calcule depuis git (scripts/version.mjs, façon GitVersion) : aucune pull request ne l'écrit.
      # Sur une pull request, c'est la version qu'aura main après la fusion.
      - name: Calculer la version
        id: version
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
      # Chaque pull request décrit ce qu'elle change dans un fragment du journal (docs/_journal/<nom>.md).
      - name: Vérifier le journal de la documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run docs:check -- "origin/$BASE_REF"
      - run: npm test
      # L'application, telle que Cloudflare la construit (base « / ») : vérification seulement, rien n'est publié d'ici.
      - run: npm run build
      # Le site de documentation, publié sur GitHub Pages dans /<nom du dépôt>/.
      - run: npm run docs:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist-docs

  # Pose l'étiquette vX.Y.Z sur le commit publié : repère lisible dans l'historique, et point d'ancrage court
  # pour le calcul des versions suivantes. N'exécute aucun code du dépôt (appel à l'API seulement).
  tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Étiqueter la version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version inattendue : $VERSION"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "v$VERSION existe déjà."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
            echo "Étiquette v$VERSION posée sur $GITHUB_SHA."
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Seul ce job peut publier : il n'exécute aucun code du dépôt.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
