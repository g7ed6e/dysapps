name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aucune permission par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  # On annule les anciennes exécutions de PR, jamais un déploiement en cours sur main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (mises à jour par Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tout l'historique : la vérification de version compare avec la branche de base.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Pas de cache partagé : évite l'empoisonnement de cache entre exécutions.
          package-manager-cache: false
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les signatures des paquets npm
        run: npm audit signatures
      # Chaque pull request monte la version mineure : chaque build publié porte un numéro nouveau.
      - name: Vérifier l'incrément de version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run version:check -- "origin/$BASE_REF"
      - run: npm test
      - run: npm run build
        env:
          # GitHub Pages sert le site dans /<nom du dépôt>/ (Cloudflare, lui, le sert à la racine).
          DEPLOY_TARGET: github
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Seul ce job peut publier : il n'exécute aucun code du dépôt.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
